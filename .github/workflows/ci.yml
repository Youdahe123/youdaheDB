name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read        # this workflow only reads the repo; nothing needs write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }}, Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: macos-latest
            rust: stable
          - os: ubuntu-latest
            rust: '1.89.0'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component clippy,rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo +${{ matrix.rust }} build --verbose

      - name: Test
        run: cargo +${{ matrix.rust }} test --verbose

      # advisory for now - these fail on style, not correctness
      - name: Clippy
        run: cargo +${{ matrix.rust }} clippy -- -W clippy::all
        continue-on-error: true

      - name: Format check
        run: cargo +${{ matrix.rust }} fmt --check
        continue-on-error: true
